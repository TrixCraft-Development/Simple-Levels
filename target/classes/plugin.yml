name: SimpleLevels
main: de.nitrox.levelsystem.LevelSystem
version: 1.5
api-version: 1.20
description: Multi-LevelSystem plugin
author: Nitrox_XD
softdepend: [PlaceholderAPI]

commands:
  simplelevels:
    description: Main command for the SimpleLevels plugin
    usage: /simplelevels <subcommand>
    aliases: [sl]

permissions:
  simplelevels.addxp:
    description: Allows adding XP
    default: op

  simplelevels.removexp:
    description: Allows removing XP
    default: op

  simplelevels.reload:
    description: Allows reloading the plugin
    default: op

  simplelevels.gui:
    description: Allows opening the level system GUI
    default: true

  simplelevels.testreward:
    description: Allows testing level rewards via command
    default: op